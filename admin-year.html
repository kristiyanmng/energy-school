
<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебна година | Energy School</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><a class="logo" href="index.html"><i>E</i><span>Energy <b>School</b></span></a><nav></nav><a class="logout" href="index.html">Изход</a></aside><main class="workspace"><header><button class="hamburger">☰</button><input placeholder="Търсене в настройките..."><div class="user"></div></header><section class="page year-page"><div class="page-heading"><div><small class="orange">НАСТРОЙКИ</small><h1>Учебни години</h1><p>Срокове, ваканции и архив на учебните години.</p></div><button class="primary compact" id="dbNewYear">+ Нова учебна година</button></div><p id="dbYearMessage">Зареждане...</p><section class="card"><div class="card-head"><h2>Учебни години</h2></div><div class="table-scroll"><table class="users-table"><thead><tr><th>Година</th><th>Период</th><th>Класове</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="dbYearsBody"></tbody></table></div></section><div class="year-tabs"><button class="active" data-db-year-tab="periods">Срокове</button><button data-db-year-tab="holidays">Ваканции</button></div><section class="student-panel active" data-db-year-panel="periods"><div id="dbPeriodCards" class="period-grid"></div></section><section class="student-panel" data-db-year-panel="holidays"><div class="section-actions"><div><h2 id="dbHolidayTitle">Ваканции и неучебни дни</h2><p>Добавят се към избраната учебна година.</p></div><button class="primary compact" id="dbAddHoliday">+ Добави период</button></div><div id="dbHolidaysList" class="holidays-list"></div></section></section></main></div><div class="modal-backdrop" id="dbYearModal" hidden><section class="modal"><button class="modal-close db-year-dismiss">×</button><small class="orange">УЧЕБНА ГОДИНА</small><h2 id="dbYearModalTitle">Нова учебна година</h2><form id="dbYea const YEAR_API="https://energy-school-api.energypublishing.workers.dev",yearToken=sessionStorage.getItem("energySchoolToken")||localStorage.getItem("energySchoolToken");let yearData={years:[],selected:null,holidays:[]},selectedYearId=0;const yearsBody=document.querySelector("#dbYearsBody"),yearMessage=document.querySelector("#dbYearMessage"),yearModal=document.querySelector("#dbYearModal"),holidayModal=document.querySelector("#dbHolidayModal");async function yearApi(path,options={}){const r=await fetch(YEAR_API+path,{...options,headers:{Authorization:"Bearer "+yearToken,"Content-Type":"application/json"}}),d=await r.json();if(!r.ok)throw new Error(d.error||"Грешка при заявката.");return d}const dateBg=v=>v?new Date(v+"T12:00:00").toLocaleDateString("bg-BG"):"—";async function loadYears(id=selectedYearId){try{yearData=await yearApi("/api/admin/academic-years"+(id?"?yearId="+id:""));selectedYearId=Number(yearData.selected?.id||0);yearMessage.textContent="";renderYears()}catch(e){yearMessage.textContent=e.message}}function renderYears(){yearsBody.innerHTML=yearData.years.map(y=>`<tr class="${Number(y.id)===selectedYearId?"selected-row":""}"><td><b>${y.name}</b></td><td>${dateBg(y.starts_on)} – ${dateBg(y.ends_on)}</td><td>${y.class_count}</td><td><span class="status ${y.status}">${y.status==="active"?"Активна":y.status==="draft"?"Чернова":"Архивирана"}</span></td><td><button data-view-year="${y.id}">Отвори</button>${y.status!=="archived"?`<button data-edit-year="${y.id}">Редактирай</button>`:""}${y.status==="draft"?`<button class="small-primary" data-activate-year="${y.id}">Активирай</button><button data-archive-year="${y.id}">Архивирай</button>`:""}</td></tr>`).join("");const y=yearData.selected;if(!y){document.querySelector("#dbPeriodCards").innerHTML='<div class="empty-state">Няма учебна година.</div>';return}document.querySelector("#dbPeriodCards").innerHTML=`<article class="card period-card"><div class="period-number">I</div><div><small>ПЪРВИ УЧЕБЕН СРОК</small><h2>${dateBg(y.starts_on)} – ${dateBg(y.first_term_ends_on)}</h2></div></article><article class="card period-card"><div class="period-number">II</div><div><small>ВТОРИ УЧЕБЕН СРОК</small><h2>${dateBg(y.second_term_starts_on)} – ${dateBg(y.ends_on)}</h2></div></article>`;document.querySelector("#dbHolidayTitle").textContent="Ваканции · "+y.name;document.querySelector("#dbHolidaysList").innerHTML=yearData.holidays.map(h=>`<article class="card holiday-row"><span class="holiday-icon">□</span><div><h3>${h.name}</h3><p>${dateBg(h.starts_on)} – ${dateBg(h.ends_on)}</p></div><span class="holiday-days">${Math.round((new Date(h.ends_on)-new Date(h.starts_on))/86400000)+1} дни</span><button data-delete-holiday="${h.id}">Премахни</button></article>`).join("")||'<div class="empty-state"><b>Няма добавени ваканции</b></div>'}function openYear(y=null){document.querySelector("#dbYearForm").reset();document.querySelector("#dbYearId").value=y?.id||"";document.querySelector("#dbYearName").value=y?.name||"";document.querySelector("#dbYearStart").value=y?.starts_on||"";document.querySelector("#dbYearEnd").value=y?.ends_on||"";document.querySelector("#dbFirstTermEnd").value=y?.first_term_ends_on||"";document.querySelector("#dbSecondTermStart").value=y?.second_term_starts_on||"";document.querySelector("#dbYearModalTitle").textContent=y?"Редактиране на година":"Нова учебна година";document.querySelector("#dbYearError").textContent="";yearModal.hidden=false}document.querySelector("#dbNewYear").onclick=()=>openYear();document.querySelectorAll(".db-year-dismiss").forEach(b=>b.onclick=()=>yearModal.hidden=true);document.querySelector("#dbYearForm").onsubmit=async e=>{e.preventDefault();const id=document.querySelector("#dbYearId").value,error=document.querySelector("#dbYearError"),payload={name:document.querySelector("#dbYearName").value,startsOn:document.querySelector("#dbYearStart").value,endsOn:document.querySelector("#dbYearEnd").value,firstTermEndsOn:document.querySelector("#dbFirstTermEnd").value,secondTermStartsOn:document.querySelector("#dbSecondTermStart").value};try{await yearApi(id?"/api/admin/academic-years/"+id:"/api/admin/academic-years",{method:id?"PATCH":"POST",body:JSON.stringify(payload)});yearModal.hidden=true;await loadYears(id||0)}catch(e){error.textContent=e.message}};yearsBody.onclick=async e=>{const view=e.target.dataset.viewYear,edit=e.target.dataset.editYear,activate=e.target.dataset.activateYear,archive=e.target.dataset.archiveYear;if(view)return loadYears(Number(view));if(edit)return openYear(yearData.years.find(y=>Number(y.id)===Number(edit)));if(activate){if(!confirm("Активирането ще архивира текущата активна година. Продължаваме ли?"))return;await yearApi("/api/admin/academic-years/"+activate,{method:"PATCH",body:JSON.stringify({action:"activate"})});return loadYears(Number(activate))}if(archive){await yearApi("/api/admin/academic-years/"+archive,{method:"PATCH",body:JSON.stringify({action:"archive"})});return loadYears()}};document.querySelectorAll("[data-db-year-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-db-year-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll("[data-db-year-panel]").forEach(x=>x.classList.toggle("active",x.dataset.dbYearPanel===b.dataset.dbYearTab))});document.querySelector("#dbAddHoliday").onclick=()=>{document.querySelector("#dbHolidayForm").reset();document.querySelector("#dbHolidayError").textContent="";holidayModal.hidden=false};document.querySelectorAll(".db-holiday-dismiss").forEach(b=>b.onclick=()=>holidayModal.hidden=true);document.querySelector("#dbHolidayForm").onsubmit=async e=>{e.preventDefault();const error=document.querySelector("#dbHolidayError");try{await yearApi("/api/admin/holidays",{method:"POST",body:JSON.stringify({yearId:selectedYearId,name:document.querySelector("#dbHolidayName").value,startsOn:document.querySelector("#dbHolidayStart").value,endsOn:document.querySelector("#dbHolidayEnd").value})});holidayModal.hidden=true;await loadYears()}catch(e){error.textContent=e.message}};document.querySelector("#dbHolidaysList").onclick=async e=>{const id=e.target.dataset.deleteHoliday;if(!id||!confirm("Да премахна ли този период?"))return;await yearApi("/api/admin/holidays/"+id,{method:"DELETE"});await loadYears()};loadYears();
