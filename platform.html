<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy School Platform</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="platform.css?v=1"></head><body class="platform-body"><main class="platform-shell"><header><a class="logo" href="index.html"><i>E</i><span>Energy <b>School</b></span></a><strong>PLATFORM ADMINISTRATION</strong><button id="platformLogout" hidden>Изход</button></header><section id="platformAuth" class="platform-auth"><article><small>СОБСТВЕНИК НА ПЛАТФОРМАТА</small><h1>Управление на училищата</h1><p>Този профил е отделен от директорските профили.</p><form id="platformLoginForm"><label>Потребител или имейл<input id="platformIdentifier" required></label><label>Парола<input id="platformPassword" type="password" required></label><p id="platformLoginError"></p><button class="primary">Вход</button></form><details><summary>Първоначално създаване на платформен администратор</summary><form id="platformSetupForm"><label>SETUP_SECRET<input id="platformSetupSecret" type="password" required></label><label>Име<input id="platformFirst" required></label><label>Фамилия<input id="platformLast" required></label><label>Имейл<input id="platformEmail" type="email" required></label><label>Потребител<input id="platformUsername" required></label><label>Силна парола<input id="platformNewPassword" type="password" required></label><p id="platformSetupError"></p><button>Създай първия администратор</button></form></details></article></section><section id="platformApp" hidden><div class="platform-heading"><div><small>ENERGY SCHOOL</small><h1>Училища</h1><p id="platformState">Зареждане...</p></div><button class="primary compact" id="openPlatformSchool">+ Ново училище</button></div><div id="platformSchools" class="platform-schools"></div></section></main><div class="modal-backdrop" id="platformSchoolModal" hidden><section class="modal"><button class="modal-close platform-school-dismiss">×</button><h2>Ново училище</h2><form id="platformSchoolForm"><div class="form-grid"><label class="wide">Официално име<input id="platformSchoolName" required></label><label>Код за вход<input id="platformSchoolCode" required placeholder="SCHOOL-SOFIA-01"></label><label>Град<input id="platformSchoolCity"></label><label class="wide">Адрес<input id="platformSchoolAddress"></label></div><p id="platformSchoolError"></p><div class="modal-actions"><button type="button" class="platform-school-dismiss">Отказ</button><button class="primary compact">Създай</button></div></form></section></div><div class="modal-backdrop" id="platformDirectorModal" hidden><section class="modal"><button class="modal-close platform-director-dismiss">×</button><h2>Нов директор</h2><form id="platformDirectorForm"><input id="platformDirectorSchool" type="hidden"><div class="form-grid"><label>Име<input id="platformDirectorFirst" required></label><label>Фамилия<input id="platformDirectorLast" required></label><label>Имейл<input id="platformDirectorEmail" type="email" required></label><label>Потребител<input id="platformDirectorUsername" required></label><label class="wide">Временна парола<input id="platformDirectorPassword" type="password" required></label></div><p id="platformDirectorError"></p><div class="modal-actions"><button type="button" class="platform-director-dismiss">Отказ</button><button class="primary compact">Създай директора</button></div></form></section></div><script src="platform.js?v=1"></script></body></html>
