<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смяна на парола | Energy School</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><a class="logo" href="index.html"><i>E</i><span>Energy <b>School</b></span></a><nav><a class="active" href="change-password.html">⚿ Сигурност</a></nav><a class="logout" href="index.html">Изход</a></aside><main class="workspace"><header><button class="hamburger">☰</button><div></div><div class="user"></div></header><section class="page"><div class="page-heading"><div><small class="orange">СИГУРНОСТ</small><h1>Смяна на парола</h1><p>Временната парола трябва да бъде заменена преди да продължите.</p></div></div><section class="card" style="max-width:650px"><form id="changePasswordForm"><div class="form-grid"><label class="wide">Текуща парола<input id="currentPassword" type="password" autocomplete="current-password" required></label><label class="wide">Нова парола<input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></label><label class="wide">Повторете новата парола<input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label></div><p>Минимум 10 знака, главна и малка буква, цифра и специален знак.</p><p id="passwordMessage" class="conflict-message"></p><button class="primary compact" id="changePasswordButton">Смени паролата</button></form></section></section></main></div><script src="app.js?v=calendar-1"></script><script src="change-password.js?v=1"></script></body></html>
