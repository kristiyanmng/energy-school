<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебна година | Energy School</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><a class="logo" href="index.html"><i>E</i><span>Energy <b>School</b></span></a><nav></nav><a class="logout" href="index.html">Изход</a></aside><main class="workspace"><header><button class="hamburger">☰</button><input placeholder="Търсене в настройките..."><div class="user"></div></header><section class="page year-page"><div class="page-heading"><div><small class="orange">НАСТРОЙКИ</small><h1>Учебни години</h1><p>Срокове, ваканции и архив на учебните години.</p></div><button class="primary compact" id="dbNewYear">+ Нова учебна година</button></div><p id="dbYearMessage">Зареждане...</p><section class="card"><div class="card-head"><h2>Учебни години</h2></div><div class="table-scroll"><table class="users-table"><thead><tr><th>Година</th><th>Период</th><th>Класове</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="dbYearsBody"></tbody></table></div></section><div class="year-tabs"><button class="active" data-db-year-tab="periods">Срокове</button><button data-db-year-tab="holidays">Ваканции</button></div><section class="student-panel active" data-db-year-panel="periods"><div id="dbPeriodCards" class="period-grid"></div></section><section class="student-panel" data-db-year-panel="holidays"><div class="section-actions"><div><h2 id="dbHolidayTitle">Ваканции и неучебни дни</h2><p>Добавят се към избраната учебна година.</p></div><button class="primary compact" id="dbAddHoliday">+ Добави период</button></div><div id="dbHolidaysList" class="holidays-list"></div></section></section></main></div><div class="modal-backdrop" id="dbYearModal" hidden><section class="modal"><button class="modal-close db-year-dismiss">×</button><small class="orange">УЧЕБНА ГОДИНА</small><h2 id="dbYearModalTitle">Нова учебна година</h2><form id="dbYearForm"><input id="dbYearId" type="hidden"><div class="form-grid"><label class="wide">Наименование<input id="dbYearName" required placeholder="2027 / 2028"></label><label>Начало<input id="dbYearStart" type="date" required></label><label>Край<input id="dbYearEnd" type="date" required></label><label>Край на първи срок<input id="dbFirstTermEnd" type="date" required></label><label>Начало на втори срок<input id="dbSecondTermStart" type="date" required></label></div><p id="dbYearError" class="conflict-message"></p><div class="modal-actions"><button type="button" class="secondary-button db-year-dismiss">Отказ</button><button class="primary compact">Запази</button></div></form></section></div><div class="modal-backdrop" id="dbHolidayModal" hidden><section class="modal"><button class="modal-close db-holiday-dismiss">×</button><small class="orange">КАЛЕНДАР</small><h2>Добавяне на ваканция</h2><form id="dbHolidayForm"><div class="form-grid"><label class="wide">Наименование<input id="dbHolidayName" required placeholder="Есенна ваканция"></label><label>Начална дата<input id="dbHolidayStart" type="date" required></label><label>Крайна дата<input id="dbHolidayEnd" type="date" required></label></div><p id="dbHolidayError" class="conflict-message"></p><div class="modal-actions"><button type="button" class="secondary-button db-holiday-dismiss">Отказ</button><button class="primary compact">Запази</button></div></form></section></div><script src="app.js"></script><script src="admin-year-api.js"></script></body></html>
