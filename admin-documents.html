<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Документи и заявления | Energy School</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard-v2.css?v=3"><link rel="stylesheet" href="notifications.css?v=notifications-1"><link rel="stylesheet" href="reference-theme.css?v=portal-1"></head><body><div class="app"><aside><a class="logo" href="admin.html"><i>E</i><span>Energy <b>School</b></span></a><nav></nav><a class="logout" href="index.html">Изход</a></aside><main class="workspace"><header><button class="hamburger">☰</button><input id="documentSearch" placeholder="Търсене на заявление..."><div class="user"></div></header><section class="page"><div class="page-heading"><div><small class="orange">АДМИНИСТРАТИВНИ УСЛУГИ</small><h1>Документи и заявления</h1><p>Образци, подадени заявления и решения.</p></div><button class="primary compact" id="newTemplate">+ Нов образец</button></div><div class="mini-stats"><article><b id="docNew">0</b><span>Нови</span></article><article><b id="docReview">0</b><span>В обработка</span></article><article><b id="docApproved">0</b><span>Одобрени</span></article><article><b id="docTemplates">0</b><span>Образци</span></article></div><p id="documentState">Зареждане...</p><section class="card users-card"><div class="table-scroll"><table class="users-table"><thead><tr><th>Заявление</th><th>Ученик</th><th>Подадено</th><th>Статус</th><th>Действие</th></tr></thead><tbody id="applicationBody"></tbody></table></div></section><h2 class="section-title">Публикувани образци</h2><div id="templateList" class="document-grid"></div></section></main></div><div class="modal-backdrop" id="templateModal" hidden><section class="modal"><button class="modal-close template-dismiss">×</button><small class="orange">НОВ ОБРАЗЕЦ</small><h2>Публикуване на документ</h2><form id="templateForm"><div class="form-grid"><label class="wide">Име<input id="templateTitle" required></label><label class="wide">Описание<textarea id="templateDescription" required></textarea></label><label>Достъпен за<select id="templateRole"><option value="both">Ученици и родители</option><option value="student">Само ученици</option><option value="parent">Само родители</option></select></label><label>Линк към образеца<input id="templateUrl" type="url" placeholder="https://..."></label></div><p id="templateError" class="conflict-message"></p><div class="modal-actions"><button type="button" class="secondary-button template-dismiss">Отказ</button><button class="primary compact">Публикувай</button></div></form></section></div><div class="modal-backdrop" id="reviewModal" hidden><section class="modal"><button class="modal-close review-dismiss">×</button><small class="orange">ОБРАБОТКА</small><h2 id="reviewTitle">Заявление</h2><form id="reviewForm"><input id="reviewId" type="hidden"><label>Нов статус<select id="reviewStatus"><option value="in_review">В обработка</option><option value="approved">Одобрено</option><option value="correction">За корекция</option><option value="rejected">Отказано</option></select></label><label>Бележка от директора<textarea id="reviewNote"></textarea></label><p id="reviewError" class="conflict-message"></p><div class="modal-actions"><button type="button" class="secondary-button review-dismiss">Отказ</button><button class="primary compact">Запази решението</button></div></form></section></div><script src="app.js?v=topics-1"></script><script src="admin-documents.js?v=documents-1"></script><script src="professional-shell.js?v=shell-2"></script><script src="notification-center.js?v=notifications-1"></script></body></html>
